<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <!-- <meta name="author" content="Your Name"> -->
      <meta name="description" content="A quiz about Texas trees and plants.">
      <meta name="keywords" content="Texas, trees, quiz, plants, nature, live oak.">
      <title>Texas Tree Quiz</title>
      
      <!-- CSS Frameworks & Fonts -->
      <link class="bulma" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
      <link rel="stylesheet" href="https://wikiki.github.io/css/documentation.css?v=201911011043">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap">
      
      <!-- Favicons -->
      <!-- We are now pulling the icon directly from your Flask static folder -->
      <!-- This bypasses any strict AWS S3 security policies blocking tab icons -->
      <link rel="icon" type="image/png" href="{{ url_for('static', filename='box_elder_icon.png') }}">
      <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='box_elder_icon.png') }}">
      
      <!-- Leaflet & Esri Scripts/Styles -->
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
      <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
      <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
      <script src="https://unpkg.com/esri-leaflet-vector@4.2.3/dist/esri-leaflet-vector.js"></script>    
   </head>

   <body>
      <header class="hero is-light">
         <div class="hero-body">
            <div class="container">
               <h1 class="title has-text-centered">
                  Texas Tree Quiz 
               </h1>
               <h1 class="subtitle has-text-centered">
                  Trees, flowers, and more!
               </h1>
               
               <nav class="navbar is-transparent" role="navigation" aria-label="main navigation">
                  <!-- Used Bulma's "buttons" class for better layout and fixed invalid ul > a nesting -->
                  <div class="buttons is-centered mt-4" style="width: 100%;">
                     <!-- Quiz button and Species Info button - toggle map button completely removed -->
                     <a class="button is-light" id="quizButton" href="{{ url_for('render_webpage') }}">Quiz</a>
                     <a class="button is-light" id="speciesInfoButton" href="{{ url_for('render_plant_info') }}">Species Information</a>
                  </div>
               </nav>
            </div>
         </div>
      </header>
      
      <!-- Fixed typo 'is is-fullwidth' to 'is-fullwidth' -->
      <div class="hero-foot has-background-dark py-4 is-fullwidth is-responsive"></div>

      <!-- Wrapped content in a semantic main tag for better accessibility -->
      <main>
         {% block content %}
         {% endblock %}
      </main>

      <div class="hero-foot has-background-dark py-4"></div>
      
      <footer class="footer is-light">
         <div class="content has-text-centered">
            <div class="subfooter">
               Plant Identification Learning Tool
            </div>
            <div class="footer">
               <span class="website">texastreequiz.com</span>
               <!-- Updated date and removed copyright symbol as requested -->
               <span class="date">May 2026</span>
            </div>
         </div>
      </footer>
      
      {% if current_route == 'render_webpage' %}
      <script src="{{ url_for('static', filename='script.js') }}"></script>
      {% endif %}
   </body>
</html>
